services:
  db:
    image: postgres:16-alpine
    ports:
      - 127.0.0.1:5432:5432
    environment:
      - POSTGRES_USER=hookrelay
      - POSTGRES_PASSWORD=hookrelay_dev
      - POSTGRES_DB=hookrelay

    volumes:
      - 'hookrelay_pgdata:/var/lib/postgresql/data/'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookrelay -d hookrelay"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  hookrelay_pgdata: