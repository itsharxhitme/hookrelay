[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "hookrelay"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "pydantic",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic"
    
]
[project.optional-dependencies]
dev = ["pytest","pytest-asyncio","httpx2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

